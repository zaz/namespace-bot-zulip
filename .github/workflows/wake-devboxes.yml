# Namespace-independent wake-up for the bot's devboxes (this workspace stops
# every instance 3h after boot; a stopped devbox only restarts on a start call).
#
# Design rule: this workflow must NEVER fail for configuration or transient
# platform reasons — a failed run emails the repo owner. Problems are logged
# in the run output and surface through the bot being unresponsive instead.
#
# SCHEDULE DISABLED until the NSC_TOKEN_JSON repository secret exists. Create
# the secret from a scoped token file:
#   nsc token create --user --name zulip-pinger --expires_in 365d \
#     --grant '{"resource_type":"devbox","resource_id":"*","actions":["activate","fetch","list"]}' \
#     --token_file token.json
# then restore:
#   schedule:
#     - cron: "*/10 * * * *"
name: wake-devboxes
on:
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wake devboxes (never fails the run)
        env:
          NSC_TOKEN_JSON: ${{ secrets.NSC_TOKEN_JSON }}
          BOXES: zulip-bot-head,fleet-workhorse
        run: |
          set +e
          if [ -z "$NSC_TOKEN_JSON" ]; then
            echo "::notice::NSC_TOKEN_JSON secret not set; nothing to do"
            exit 0
          fi
          printf '%s' "$NSC_TOKEN_JSON" > "$RUNNER_TEMP/token.json"
          npm install --no-audit --no-fund --silent @namespacelabs/sdk || { echo "::warning::npm install failed; skipping"; exit 0; }
          NSC_TOKEN_FILE="$RUNNER_TEMP/token.json" node infra/wake-devboxes.mjs || echo "::warning::wake script reported errors (see log above)"
          exit 0
